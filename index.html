<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日の名言</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background: #191919;
      }
    }
    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .quote-card {
      width: 100vw;
      min-height: 30vw;
      background: linear-gradient(135deg, #4A90E2 0%, #87CEEB 50%, #FFD580 100%);
      border-radius: 16px;
      padding: 4vw 5vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .category {
      font-size: 2vw;
      color: rgba(255,255,255,0.9);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 2vw;
    }
    .quote-text {
      font-size: 3.2vw;
      line-height: 1.7;
      color: #fff;
      margin-bottom: 2vw;
      text-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    .author {
      font-size: 2.2vw;
      color: rgba(255,255,255,0.9);
    }
    .author::before {
      content: '— ';
    }
  </style>
</head>
<body>
  <div class="quote-card">
    <div class="category" id="category"></div>
    <div class="quote-text" id="quote"></div>
    <div class="author" id="author"></div>
  </div>

  <script>
    const quotes = [
      {
        text: "どんな経験も、未来につながる。",
        author: "ハローキティのニーチェ",
        category: "人生"
      },
      {
        text: "「できる！」って、あなたが信じたら、きっとできる。",
        author: "ハローキティのニーチェ",
        category: "成長"
      },
      {
        text: "人生はさながら、旅のようなもの。自分という人生を体験する、終わりのない旅。",
        author: "ハローキティのニーチェ",
        category: "人生"
      },
      {
        text: "本当の気持ちは、欲しいものを手に入れる魔法の杖。",
        author: "ハローキティのニーチェ",
        category: "成長"
      }
    ];

    function getDailyIndex() {
      const today = new Date();
      const seed = today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();
      return seed % quotes.length;
    }

    function displayQuote() {
      const index = getDailyIndex();
      const quote = quotes[index];
      document.getElementById('category').textContent = quote.category;
      document.getElementById('quote').textContent = quote.text;
      document.getElementById('author').textContent = quote.author;
    }

    displayQuote();
  </script>
</body>
</html>
